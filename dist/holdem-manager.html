/* ==========================================================================
   홀덤 매니저 — 디자인 시스템
   다크 카지노 톤 (차콜/네이비) + 펠트 그린 테이블 + 골드 포인트
   ========================================================================== */
:root {
  --bg: #090c11;
  --bg-2: #0d1218;
  --surface: #131922;
  --surface-2: #19202b;
  --surface-3: #222b38;
  --line: #263040;
  --line-2: #344155;
  --text: #eef2f7;
  --text-2: #a9b4c4;
  --text-3: #6c7a8e;
  --gold: #f6c350;
  --gold-2: #e0a42a;
  --gold-soft: rgba(246, 195, 80, .14);
  --green: #2ecc71;
  --green-soft: rgba(46, 204, 113, .14);
  --red: #ff5964;
  --red-soft: rgba(255, 89, 100, .14);
  --blue: #4c8dff;
  --r-sm: 10px;
  --r: 16px;
  --r-lg: 22px;
  --nav-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --font: "Pretendard", "SUIT", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
    "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%;
  background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 16px; line-height: 1.4;
  overscroll-behavior: none;
}
body { -webkit-user-select: none; user-select: none; touch-action: manipulation; }
input, textarea { -webkit-user-select: text; user-select: text; }
button { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
svg { display: block; }
.num, .tnum { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* ---------- 레이아웃 ---------- */
.shell { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.main { flex: 1; min-height: 0; overflow-y: auto; position: relative; -webkit-overflow-scrolling: touch; }
.main.fixed { overflow: hidden; display: flex; flex-direction: column; }

.nav {
  order: 2; flex: none;
  display: flex; justify-content: space-around; align-items: stretch;
  height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b);
  background: rgba(11, 15, 21, .96); border-top: 1px solid var(--line);
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  background: none; border: 0; color: var(--text-3); font-size: 11.5px; font-weight: 700; cursor: pointer;
  position: relative;
}
.nav-item svg { width: 24px; height: 24px; }
.nav-item .ico-wrap { width: 52px; height: 30px; border-radius: 99px; display: grid; place-items: center; transition: background .2s; }
.nav-item.on { color: var(--gold); }
.nav-item.on .ico-wrap { background: var(--gold-soft); }
.nav-dot { position: absolute; top: 9px; left: calc(50% + 10px); width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px var(--bg); }

@media (orientation: landscape) and (min-width: 700px) {
  .shell { flex-direction: row; }
  .nav {
    order: 0; flex-direction: column; justify-content: flex-start; gap: 8px;
    width: 86px; height: auto; padding: 16px 0 calc(16px + var(--safe-b));
    border-top: 0; border-right: 1px solid var(--line);
  }
  .nav-item { flex: none; height: 68px; font-size: 12px; }
  .nav-item .ico-wrap { width: 56px; height: 34px; }
  .nav-brand { display: grid !important; }
}
.nav-brand {
  display: none; place-items: center; height: 52px; margin-bottom: 8px;
  color: var(--gold); font-size: 30px; line-height: 1;
}

/* ---------- 공통 컴포넌트 ---------- */
.page { padding: 20px 16px 32px; max-width: 1100px; margin: 0 auto; }
.page.narrow { max-width: 760px; }
@media (min-width: 760px) { .page { padding: 28px 28px 40px; } }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.page-title { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; }
.stack-v { display: flex; flex-direction: column; gap: 14px; }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 18px;
}
@media (min-width: 760px) { .card { padding: 22px; } }
.card + .card { margin-top: 14px; }
.sec-title { font-size: 17px; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.sec-title .count { margin-left: auto; font-size: 14px; color: var(--text-3); font-weight: 700; }
.hint { font-size: 13px; color: var(--text-3); }
.hint b { color: var(--text-2); }
.divider { height: 1px; background: var(--line); margin: 16px 0; }

.btn {
  appearance: none; border: 0; border-radius: 14px; min-height: 48px; padding: 0 18px;
  font-weight: 700; font-size: 16px; color: var(--text); background: var(--surface-3);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
  transition: transform .08s ease, filter .15s, opacity .15s; white-space: nowrap;
}
.btn:active { transform: scale(.96); filter: brightness(1.1); }
.btn[disabled] { opacity: .35; pointer-events: none; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn-sm { min-height: 40px; padding: 0 14px; font-size: 14px; border-radius: 12px; }
.btn-lg { min-height: 58px; font-size: 18px; border-radius: 16px; padding: 0 24px; }
.btn-block { width: 100%; }
.btn-ghost { background: transparent; border: 1px solid var(--line-2); }
.btn-gold {
  background: linear-gradient(180deg, #ffd673, #f0aa1e); color: #1e1504;
  box-shadow: 0 6px 20px rgba(240, 170, 30, .25), inset 0 1px 0 rgba(255, 255, 255, .45);
}
.btn-green { background: linear-gradient(180deg, #3ddc84, #1fae5f); color: #03140a; box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }
.btn-red { background: linear-gradient(180deg, #ff6b73, #e0323d); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
.btn-danger-ghost { background: var(--red-soft); color: var(--red); }
.btn-icon { width: 48px; padding: 0; }
.btn-icon.sm { width: 40px; min-height: 40px; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field-label { font-size: 13px; color: var(--text-2); font-weight: 700; }
.input {
  width: 100%; height: 52px; border-radius: 12px; border: 1px solid var(--line-2);
  background: var(--bg-2); color: var(--text); font: inherit; font-size: 18px; font-weight: 600;
  padding: 0 14px; font-variant-numeric: tabular-nums;
}
.input:focus { outline: 2px solid var(--gold); outline-offset: -1px; border-color: transparent; }
.input::placeholder { color: var(--text-3); font-weight: 500; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 420px) { .grid-3 { grid-template-columns: 1fr 1fr; } }

.chips-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.chip-opt {
  height: 36px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line-2);
  background: var(--surface-2); color: var(--text-2); font-weight: 700; font-size: 14px; cursor: pointer;
}
.chip-opt.on { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }
.chip-opt:active { transform: scale(.96); }

/* 토글 스위치 */
.toggle-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; cursor: pointer; }
.toggle-row + .toggle-row { border-top: 1px solid var(--line); }
.toggle-row .t-text { flex: 1; }
.toggle-row .t-title { font-weight: 700; }
.toggle-row .t-sub { font-size: 13px; color: var(--text-3); }
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--surface-3); transition: background .2s; }
.switch i::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%;
  background: #fff; transition: transform .2s; box-shadow: 0 2px 6px rgba(0,0,0,.35);
}
.switch input:checked + i { background: var(--gold-2); }
.switch input:checked + i::after { transform: translateX(20px); }
.sub-fields { padding: 4px 0 14px; }

.avatar {
  width: 40px; height: 40px; border-radius: 50%; flex: none;
  background: var(--c, var(--gold)); color: #0b0f14; font-weight: 900; font-size: 17px;
  display: grid; place-items: center;
}
.avatar.sm { width: 34px; height: 34px; font-size: 15px; }
.avatar.lg { width: 56px; height: 56px; font-size: 24px; }

.tag {
  display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px;
  font-size: 11.5px; font-weight: 800; background: var(--surface-3); color: var(--text-2); letter-spacing: .02em;
}
.tag.gold { background: var(--gold-soft); color: var(--gold); }
.tag.red { background: var(--red-soft); color: var(--red); }
.tag.green { background: var(--green-soft); color: var(--green); }
.plus { color: var(--green); }
.minus { color: var(--red); }

/* ---------- 새 게임 설정 ---------- */
.setup { max-width: 760px; margin: 0 auto; padding: 0 16px calc(110px + var(--safe-b)); }
.setup-hero { text-align: center; padding: 36px 0 24px; }
.logo-mark {
  width: 76px; height: 76px; margin: 0 auto 14px; border-radius: 22px;
  background: radial-gradient(circle at 50% 35%, #23905c, #0c4a2f); display: grid; place-items: center;
  color: var(--gold); font-size: 42px; box-shadow: 0 0 0 3px #2a1c13, 0 0 0 5px rgba(246,195,80,.4), 0 14px 40px rgba(0,0,0,.5);
}
.setup-hero h1 { font-size: 30px; font-weight: 900; letter-spacing: -.03em; }
.setup-hero p { color: var(--text-2); margin-top: 6px; font-size: 15px; }
.mode-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.mode-card {
  text-align: left; padding: 16px; border-radius: 18px; border: 1.5px solid var(--line-2); background: var(--surface-2);
  cursor: pointer; display: flex; flex-direction: column; gap: 6px; transition: border-color .15s, background .15s;
}
.mode-card svg { width: 28px; height: 28px; color: var(--text-3); margin-bottom: 4px; }
.mode-card b { font-size: 18px; }
.mode-card span { font-size: 13px; color: var(--text-3); }
.mode-card.on { border-color: var(--gold); background: linear-gradient(180deg, rgba(246,195,80,.12), rgba(246,195,80,.03)); }
.mode-card.on svg { color: var(--gold); }
.add-row { display: flex; gap: 10px; }
.add-row .input { flex: 1; }
.draft-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; min-height: 8px; }
.draft-chip {
  display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 6px 0 6px;
  background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 99px; font-weight: 700;
}
.draft-chip .avatar { width: 30px; height: 30px; font-size: 13px; }
.draft-chip button { width: 30px; height: 30px; border: 0; border-radius: 50%; background: var(--surface-3); color: var(--text-2); cursor: pointer; display: grid; place-items: center; }
.draft-chip button svg { width: 16px; height: 16px; }
.empty-note { color: var(--text-3); font-size: 14px; padding: 6px 2px; }
.setup-footer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  padding: 14px 16px calc(14px + var(--safe-b));
  background: linear-gradient(180deg, rgba(9,12,17,0), rgba(9,12,17,.92) 35%);
}
.setup-footer .btn { max-width: 728px; margin: 0 auto; display: flex; }
.preset-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.preset {
  padding: 14px 12px; border-radius: 14px; border: 1.5px solid var(--line-2); background: var(--surface-2);
  text-align: left; cursor: pointer;
}
.preset b { display: block; font-size: 16px; }
.preset span { font-size: 12.5px; color: var(--text-3); }
.preset.on { border-color: var(--gold); background: var(--gold-soft); }
.preset.on b { color: var(--gold); }
.struct-summary { display: flex; gap: 14px; flex-wrap: wrap; margin: 14px 0 4px; font-size: 13.5px; color: var(--text-2); }
.struct-summary b { color: var(--text); }
details.struct-details { margin-top: 10px; }
details.struct-details summary {
  list-style: none; cursor: pointer; color: var(--gold); font-weight: 700; font-size: 14px; padding: 8px 0;
}
details.struct-details summary::-webkit-details-marker { display: none; }

/* 블라인드 구조 편집 */
.lv-table { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.lv-head, .lv-row { display: grid; grid-template-columns: 44px 1fr 1fr 74px 40px; gap: 8px; align-items: center; }
.lv-head { font-size: 12px; color: var(--text-3); font-weight: 700; padding: 0 2px; }
.lv-row .input { height: 44px; font-size: 16px; padding: 0 10px; text-align: right; }
.lv-no { font-weight: 800; color: var(--text-2); text-align: center; font-variant-numeric: tabular-nums; }
.lv-row.cur .lv-no { color: var(--gold); }
.lv-row.cur .input { border-color: rgba(246,195,80,.5); }
.lv-row.brk { background: rgba(76,141,255,.07); border-radius: 12px; }
.lv-row.brk .brk-label { grid-column: span 2; color: var(--blue); font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; }
.lv-row.brk .brk-label svg { width: 18px; height: 18px; }
.lv-del { width: 40px; height: 40px; border-radius: 10px; border: 0; background: transparent; color: var(--text-3); cursor: pointer; display: grid; place-items: center; }
.lv-del svg { width: 18px; height: 18px; }
.lv-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

/* ---------- 타이머 화면 ---------- */
.clock-screen { display: grid; grid-template-columns: 1fr; gap: 14px; padding: 14px; min-height: 100%; }
@media (orientation: landscape) and (min-width: 700px) {
  .clock-screen { grid-template-columns: 1fr minmax(300px, 34%); height: 100%; padding: 18px; gap: 18px; }
  .clock-side { overflow-y: auto; }
}
.clock-main {
  position: relative; overflow: hidden; border-radius: 28px; border: 1px solid var(--line);
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(246,195,80,.13), transparent 60%),
    radial-gradient(90% 60% at 50% 120%, rgba(35,144,92,.18), transparent 60%),
    var(--surface);
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  padding: 22px 18px 26px; gap: 10px; min-height: 420px;
}
.clock-main.is-break { background: radial-gradient(120% 70% at 50% -10%, rgba(76,141,255,.2), transparent 60%), var(--surface); }
.clock-top { position: absolute; top: 14px; left: 18px; right: 12px; display: flex; align-items: center; justify-content: space-between; }
.game-name { font-size: 14px; font-weight: 700; color: var(--text-3); }
.lvl-label { font-size: clamp(16px, 2.6vw, 24px); font-weight: 900; letter-spacing: .24em; color: var(--gold); margin-top: 18px; }
.is-break .lvl-label { color: var(--blue); }
.time {
  font-size: clamp(84px, min(22vw, 26vh), 260px); font-weight: 800; line-height: .95; letter-spacing: -.03em;
  font-variant-numeric: tabular-nums; transition: color .3s;
}
@media (orientation: landscape) and (min-width: 700px) { .time { font-size: clamp(84px, min(14vw, 24vh), 260px); } }
.time.warn { color: var(--red); animation: pulse 1s ease-in-out infinite; }
.time.paused { opacity: .55; }
@keyframes pulse { 50% { opacity: .55; } }
.progress { width: min(620px, 88%); height: 8px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
.progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold-2), var(--gold)); border-radius: inherit; transition: width .3s linear; }
.is-break .progress > i { background: linear-gradient(90deg, #2f6fe0, var(--blue)); }
.blinds-now { margin-top: 10px; }
.blinds-now small { display: block; font-size: 13px; font-weight: 800; letter-spacing: .2em; color: var(--text-3); }
.blinds-now b { font-size: clamp(40px, min(9vw, 10vh), 92px); font-weight: 900; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.blinds-next { font-size: clamp(15px, 2vw, 19px); color: var(--text-2); font-weight: 600; }
.blinds-next b { color: var(--text); font-variant-numeric: tabular-nums; }
.clock-ctrls { display: flex; align-items: center; justify-content: center; gap: clamp(8px, 2vw, 18px); margin-top: 14px; }
.round-btn {
  width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--surface-2);
  display: grid; place-items: center; cursor: pointer; color: var(--text); font-weight: 800; font-size: 14px;
}
.round-btn svg { width: 22px; height: 22px; }
.round-btn:active, .play-btn:active { transform: scale(.94); }
.play-btn {
  width: 92px; height: 92px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center;
  background: linear-gradient(180deg, #ffd673, #f0aa1e); color: #1e1504;
  box-shadow: 0 10px 30px rgba(240,170,30,.35), inset 0 2px 0 rgba(255,255,255,.45);
}
.play-btn svg { width: 38px; height: 38px; }
.play-btn.running { background: var(--surface-3); color: var(--text); box-shadow: inset 0 0 0 2px var(--line-2); }
.paused-badge {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
  height: 28px; padding: 0 12px; border-radius: 99px; background: var(--red-soft); color: var(--red);
  font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 6px;
}
.paused-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1s infinite; }
.clock-side { display: flex; flex-direction: column; gap: 14px; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; min-width: 0; }
.stat.wide { grid-column: 1 / -1; }
.stat .k { font-size: 12.5px; font-weight: 700; color: var(--text-3); }
.stat .v { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .v small { font-size: 16px; color: var(--text-3); font-weight: 700; margin-left: 2px; }
.stat .s { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
.lv-list { display: flex; flex-direction: column; }
.lv-item {
  display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 8px;
  padding: 10px 6px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 10px;
  font-variant-numeric: tabular-nums; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%;
}
.lv-item:last-child { border-bottom: 0; }
.lv-item .n { color: var(--text-3); font-weight: 800; font-size: 13px; }
.lv-item .b { font-weight: 800; font-size: 16px; }
.lv-item .m { color: var(--text-3); font-size: 13px; }
.lv-item.past { opacity: .4; }
.lv-item.cur { background: var(--gold-soft); border-color: transparent; }
.lv-item.cur .n, .lv-item.cur .b { color: var(--gold); }
.lv-item.brk .b { color: var(--blue); font-weight: 700; }
.card-title { font-size: 15px; font-weight: 800; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }

/* ---------- 테이블 화면 ---------- */
.table-screen { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.topbar {
  flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border-bottom: 1px solid var(--line); background: var(--bg-2);
}
.mini-clock {
  display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 6px 0 14px; border-radius: 12px;
  background: var(--surface-2); border: 1px solid var(--line); cursor: pointer; font-variant-numeric: tabular-nums;
}
.mini-clock .mc-lv { font-size: 12px; font-weight: 900; color: var(--gold); letter-spacing: .08em; }
.mini-clock .mc-bl { font-weight: 800; font-size: 16px; }
.mini-clock .mc-time { font-weight: 800; font-size: 18px; min-width: 56px; text-align: right; }
.mini-clock .mc-time.warn { color: var(--red); animation: pulse 1s infinite; }
.mini-clock .mc-ico { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--surface-3); }
.mini-clock .mc-ico svg { width: 16px; height: 16px; }
.mini-clock.paused { border-color: rgba(255,89,100,.45); }
.mini-clock.paused .mc-ico { background: var(--gold); color: #1e1504; }
.mini-clock.paused .mc-time { opacity: .6; }
.topbar .hand-no { margin-left: auto; font-weight: 800; color: var(--text-3); font-size: 14px; font-variant-numeric: tabular-nums; }

.table-area { flex: 1; min-height: 220px; position: relative; overflow: hidden; }
.felt {
  position: absolute; border-radius: 9999px;
  background:
    radial-gradient(60% 55% at 50% 45%, #25975f 0%, #187448 48%, #0d4c31 100%);
  box-shadow:
    0 0 0 9px #2b1d14,
    0 0 0 11px #5d3f27,
    0 0 0 12px rgba(246, 195, 80, .35),
    0 24px 60px rgba(0, 0, 0, .6),
    inset 0 0 70px rgba(0, 0, 0, .45);
}
.felt::after {
  content: ""; position: absolute; inset: 7%; border-radius: inherit;
  border: 2px solid rgba(255, 255, 255, .06);
}
.table-center {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  text-align: center; pointer-events: none; z-index: 1; width: 60%;
}
.center-logo { font-size: 44px; color: rgba(0, 0, 0, .22); line-height: 1; }
.center-blinds { font-size: 26px; font-weight: 900; color: rgba(255,255,255,.9); font-variant-numeric: tabular-nums; }
.street-pill {
  display: inline-block; padding: 4px 12px; border-radius: 99px; background: rgba(0,0,0,.32);
  font-size: 12px; font-weight: 800; letter-spacing: .08em; color: rgba(255,255,255,.85);
}
.street-pill.sd { background: var(--gold); color: #1e1504; }
.board { display: flex; gap: 6px; justify-content: center; margin: 10px 0 8px; }
.card-slot { width: 32px; height: 45px; border-radius: 5px; border: 1.5px dashed rgba(255,255,255,.2); }
.card-slot.dealt {
  border: 0;
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.13) 0 2px, transparent 2px 6px),
    linear-gradient(135deg, #c62a2a, #7d1515);
  box-shadow: inset 0 0 0 2px #f4efe6, inset 0 0 0 4px #9d1d1d, 0 3px 8px rgba(0,0,0,.4);
  animation: deal .3s ease-out both;
}
@keyframes deal { from { transform: translateY(-10px) scale(.8); opacity: 0; } }
.pot-label { font-size: 11px; font-weight: 800; letter-spacing: .2em; color: rgba(255,255,255,.6); }
.pot-amount { font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.1; text-shadow: 0 2px 10px rgba(0,0,0,.35); }
.pot-sub { font-size: 12.5px; color: rgba(255,255,255,.7); font-weight: 600; font-variant-numeric: tabular-nums; }
.side-pots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
.side-pot {
  font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 8px; background: rgba(0,0,0,.38);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.side-pot b { color: var(--gold); }

.seat {
  position: absolute; left: 0; top: 0; width: 96px; transform: translate(-50%, -50%);
  z-index: 2; cursor: pointer; opacity: 0;
}
.seat.placed { opacity: 1; }
.seat-card {
  position: relative; padding: 20px 6px 8px; border-radius: 14px; text-align: center;
  background: linear-gradient(180deg, #1d2531, #121820); border: 1.5px solid #303c4e;
  box-shadow: 0 8px 18px rgba(0,0,0,.45);
}
.seat .avatar {
  position: absolute; top: -17px; left: 50%; transform: translateX(-50%);
  width: 36px; height: 36px; font-size: 15px; border: 3px solid #0b0f14; box-shadow: 0 2px 8px rgba(0,0,0,.4);
}
.seat .name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seat .stack { font-size: 15px; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; }
.seat .stack.allin { color: var(--red); letter-spacing: .04em; font-size: 13px; font-weight: 900; }
.seat .act-label {
  position: absolute; bottom: -11px; left: 50%; transform: translateX(-50%); white-space: nowrap;
  font-size: 11px; font-weight: 800; height: 20px; line-height: 20px; padding: 0 8px; border-radius: 99px;
  background: var(--surface-3); color: var(--text-2); box-shadow: 0 2px 6px rgba(0,0,0,.4);
}
.act-label.fold { background: #3a2a2d; color: #ff9aa1; }
.act-label.check, .act-label.call { background: #183d29; color: #7ff0ae; }
.act-label.bet, .act-label.raise { background: #4a3a12; color: var(--gold); }
.act-label.allin { background: var(--red); color: #fff; }
.act-label.win { background: var(--green); color: #03140a; }
.act-label.lose { background: #3a2a2d; color: #ff9aa1; }
.act-label.idle { background: #262d38; color: var(--text-3); }
.dbtn {
  position: absolute; top: 6px; left: -11px; width: 26px; height: 26px; border-radius: 50%;
  background: #fdfdfd; color: #111; font-weight: 900; font-size: 13px; display: grid; place-items: center;
  box-shadow: 0 2px 6px rgba(0,0,0,.55), inset 0 -2px 0 #c9c9c9; z-index: 3;
}
.pos-tag {
  position: absolute; top: -8px; right: -8px; height: 20px; padding: 0 6px; border-radius: 6px;
  font-size: 10.5px; font-weight: 900; line-height: 20px; z-index: 3; letter-spacing: .03em;
}
.pos-tag.sb { background: #2f5fb8; color: #fff; }
.pos-tag.bb { background: var(--gold); color: #1e1504; }
.seat.acting .seat-card { border-color: var(--gold); animation: glow 1.4s ease-in-out infinite; }
@keyframes glow {
  0%, 100% { box-shadow: 0 0 0 2px rgba(246,195,80,.55), 0 0 16px rgba(246,195,80,.3); }
  50% { box-shadow: 0 0 0 3px rgba(246,195,80,.9), 0 0 30px rgba(246,195,80,.6); }
}
.seat.folded, .seat.idle { opacity: .4 !important; filter: grayscale(.7); }
.seat.winner .seat-card { border-color: var(--green); box-shadow: 0 0 0 2px rgba(46,204,113,.5), 0 0 24px rgba(46,204,113,.35); }
.seat.pickable .seat-card { border-style: dashed; border-color: rgba(246,195,80,.7); }
.seat.picked .seat-card { border: 2px solid var(--green); background: linear-gradient(180deg, #17402a, #10281c); }
.seat.btn-target .seat-card { border-style: dashed; border-color: rgba(255,255,255,.18); }
.bet {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); z-index: 1;
  display: flex; align-items: center; gap: 5px; padding: 3px 10px 3px 4px; border-radius: 99px;
  background: rgba(0,0,0,.5); font-weight: 800; font-size: 13.5px; font-variant-numeric: tabular-nums; white-space: nowrap;
  opacity: 0;
}
.bet.placed { opacity: 1; }
.chip-ico {
  width: 18px; height: 18px; border-radius: 50%; flex: none;
  background: #d8353d; border: 3px dashed rgba(255,255,255,.9);
  box-shadow: 0 0 0 1px #8f1d22;
}
.chip-ico.gold { background: #e0a42a; box-shadow: 0 0 0 1px #8a6210; }

/* 액션 패널 */
.panel {
  position: relative; z-index: 4;
  flex: none; background: var(--bg-2); border-top: 1px solid var(--line);
  padding: 12px 12px 14px; max-height: 58%; overflow-y: auto;
}
.panel-row { display: flex; align-items: center; gap: 10px; }
.actor { display: flex; align-items: center; gap: 10px; min-width: 0; }
.actor b { font-size: 18px; }
.actor .sub { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.actor .sub em { font-style: normal; color: var(--gold); font-weight: 800; }
.act-log { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.act-log::-webkit-scrollbar { display: none; }
.log-item { flex: none; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 8px; background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.log-item b { color: var(--text); }
.log-street { flex: none; font-size: 11px; font-weight: 900; color: var(--gold); padding: 4px 2px; letter-spacing: .05em; }

.act-grid { display: grid; grid-template-columns: 1fr 1.3fr 1.3fr 1fr; gap: 8px; margin-top: 10px; }
.act-grid.three { grid-template-columns: 1fr 1.4fr 1fr; }
.act-grid.two { grid-template-columns: 1fr 1.6fr; }
.act-btn {
  min-height: 62px; border-radius: 16px; border: 0; cursor: pointer; font-weight: 800; font-size: 17px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; line-height: 1.15;
  transition: transform .08s, filter .15s;
}
.act-btn small { font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; opacity: .85; }
.act-btn:active { transform: scale(.95); filter: brightness(1.12); }
.act-fold { background: #272c36; color: #ff8a92; box-shadow: inset 0 0 0 1px #3a414e; }
.act-check, .act-call { background: linear-gradient(180deg, #3ddc84, #1fae5f); color: #03140a; }
.act-raise { background: linear-gradient(180deg, #ffd673, #f0aa1e); color: #1e1504; }
.act-allin { background: linear-gradient(180deg, #ff6b73, #e0323d); color: #fff; }
.act-tools { display: flex; gap: 8px; margin-top: 10px; }
.act-tools .btn { flex: 1; }

.raise-box { display: none; margin-top: 10px; padding: 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
/* 휴대폰: 레이즈 상자는 테이블 위로 떠오르는 시트 (테이블 크기를 줄이지 않음) */
.panel.raise-open { overflow: visible; }
.panel.raise-open .raise-box {
  display: block; position: absolute; left: 10px; right: 10px; bottom: calc(100% + 8px); margin: 0;
  background: var(--surface-2); border-color: var(--line-2);
  box-shadow: 0 -10px 40px rgba(0,0,0,.6); animation: up .2s cubic-bezier(.2,.9,.3,1);
}
.raise-top { display: flex; align-items: center; gap: 10px; }
.raise-amt { flex: 1; text-align: center; }
.raise-amt small { display: block; font-size: 12px; color: var(--text-3); font-weight: 700; }
.raise-input {
  width: 100%; background: transparent; border: 0; color: var(--gold); text-align: center;
  font: inherit; font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; padding: 0;
}
.raise-input:focus { outline: none; border-bottom: 2px solid var(--gold); }
.step-btn { width: 52px; height: 52px; border-radius: 14px; border: 0; background: var(--surface-3); cursor: pointer; display: grid; place-items: center; }
.step-btn svg { width: 22px; height: 22px; }
.step-btn:active { transform: scale(.94); }
.slider { width: 100%; margin: 14px 0 10px; -webkit-appearance: none; appearance: none; height: 8px; border-radius: 99px; background: var(--surface-3); outline: none; }
.slider::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; background: var(--gold); border: 4px solid #fff3d0; box-shadow: 0 2px 8px rgba(0,0,0,.5); cursor: pointer; }
.slider::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--gold); border: 4px solid #fff3d0; }
.raise-quick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.raise-quick button {
  height: 40px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface-2);
  font-weight: 800; font-size: 13.5px; cursor: pointer; color: var(--text);
}
.raise-quick button:active { background: var(--gold-soft); border-color: var(--gold); }
.raise-na { font-size: 14px; color: var(--text-2); text-align: center; padding: 6px; }

/* 태블릿: 패널 3단 가로 배치 */
@media (min-width: 760px) {
  .panel { padding: 14px 18px 16px; }
  .panel .raise-box, .panel.raise-open .raise-box { display: block; position: static; box-shadow: none; animation: none; background: var(--surface); }
  .panel-act { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(300px, 1.25fr) minmax(300px, 1.25fr); gap: 16px; align-items: stretch; }
  .panel-act .raise-box { margin-top: 0; }
  .panel-act .act-side { display: flex; flex-direction: column; justify-content: space-between; gap: 10px; min-width: 0; }
  .panel-act .act-main { display: flex; flex-direction: column; justify-content: flex-end; }
  .panel-act .act-grid { grid-template-columns: 1fr 1fr; margin-top: 0; }
  .panel-act .act-grid > :last-child:nth-child(odd) { grid-column: 1 / -1; }
  .panel-act .act-tools { margin-top: 8px; }
  .raise-close { display: none !important; }
}
@media (min-width: 760px) and (orientation: portrait) {
  .panel-act { grid-template-columns: 1fr 1fr; }
  .panel-act .act-side { grid-column: 1 / -1; flex-direction: row; align-items: center; }
  .panel-act .act-side .act-log { flex: 1; justify-content: flex-end; }
}

/* 핸드 전 / 쇼다운 / 결과 패널 */
.pre { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.pre-info { flex: 1; min-width: 240px; }
.pre-title { font-size: 18px; font-weight: 800; }
.pre-pos { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; font-size: 14px; color: var(--text-2); }
.pre-pos span { display: inline-flex; align-items: center; gap: 6px; }
.pre-pos b { color: var(--text); }
.pos-chip { font-style: normal; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 900; }
.pos-chip.d { background: #fff; color: #111; }
.pos-chip.sb { background: #2f5fb8; color: #fff; border-radius: 6px; width: 28px; height: 20px; }
.pos-chip.bb { background: var(--gold); color: #1e1504; border-radius: 6px; width: 28px; height: 20px; }
.pre-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.pre-actions .btn-lg { min-width: 200px; }
@media (max-width: 759px) { .pre-actions { width: 100%; } .pre-actions .btn-lg { flex: 1; min-width: 0; } }
.warn-line { margin-top: 8px; font-size: 13px; color: var(--red); font-weight: 700; display: flex; gap: 6px; align-items: center; }

.sd-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.sd-head b { font-size: 18px; }
.pot-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.pot-card {
  border-radius: 16px; border: 1.5px solid var(--line-2); background: var(--surface); padding: 12px; cursor: pointer;
}
.pot-card.active { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
.pot-card.resolved { border-color: rgba(46,204,113,.6); }
.pot-card.active.resolved { border-color: var(--gold); }
.pot-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.pot-card-head span { font-weight: 800; font-size: 14px; color: var(--text-2); }
.pot-card-head b { font-size: 20px; font-variant-numeric: tabular-nums; color: var(--gold); }
.pot-elig { display: flex; flex-wrap: wrap; gap: 6px; }
.pchip {
  height: 40px; padding: 0 12px 0 5px; border-radius: 99px; border: 1.5px solid var(--line-2); background: var(--surface-2);
  display: inline-flex; align-items: center; gap: 7px; font-weight: 700; cursor: pointer; color: var(--text);
}
.pchip .avatar { width: 28px; height: 28px; font-size: 12px; }
.pchip.on { border-color: var(--green); background: var(--green-soft); color: #7ff0ae; }
.pchip[disabled] { cursor: default; }
.pot-note { font-size: 12px; color: var(--text-3); margin-top: 8px; font-weight: 600; }
.sd-actions { display: flex; gap: 10px; margin-top: 12px; }
.sd-actions .btn-lg { flex: none; width: 72px; padding: 0; }
.sd-actions .btn-gold { flex: 1; width: auto; }

.done-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.done-head b { font-size: 18px; }
.done-pots { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; font-size: 14px; color: var(--text-2); }
.done-pots b { color: var(--text); font-variant-numeric: tabular-nums; }
.done-deltas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.delta-chip {
  display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px 0 4px; border-radius: 99px;
  background: var(--surface-2); font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums;
}
.delta-chip .avatar { width: 28px; height: 28px; font-size: 12px; }

/* ---------- 플레이어 화면 ---------- */
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
.player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.pcard {
  display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--line); cursor: pointer; transition: border-color .15s;
}
.pcard:active { border-color: var(--gold); }
.pcard .seat-no {
  width: 30px; height: 30px; border-radius: 9px; background: var(--surface-3); display: grid; place-items: center;
  font-weight: 800; font-size: 13px; color: var(--text-2); flex: none;
}
.pcard .pinfo { flex: 1; min-width: 0; }
.pcard .pname { font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
.pcard .psub { font-size: 12.5px; color: var(--text-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard .pstack { text-align: right; flex: none; }
.pcard .pstack b { display: block; font-size: 19px; font-variant-numeric: tabular-nums; color: var(--gold); }
.pcard .pstack small { font-size: 12.5px; color: var(--text-3); font-variant-numeric: tabular-nums; font-weight: 700; }
.pcard.out { opacity: .6; }
.pcard.out .pstack b { color: var(--text-3); }
.section-label { font-size: 13px; font-weight: 800; color: var(--text-3); margin: 22px 2px 10px; letter-spacing: .04em; }

/* ---------- 모달 ---------- */
.modal-back {
  position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
  display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease-out;
}
.modal {
  width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 24px 24px 0 0; padding: 22px 18px calc(20px + var(--safe-b));
  animation: up .22s cubic-bezier(.2,.9,.3,1);
}
@media (min-width: 640px) {
  .modal-back { align-items: center; }
  .modal { border-radius: 24px; border-bottom: 1px solid var(--line); padding: 26px; }
}
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.m-title { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
.m-body { color: var(--text-2); font-size: 15px; margin-bottom: 6px; }
.m-actions { display: flex; gap: 10px; margin-top: 20px; }
.m-actions .btn { flex: 1; min-height: 54px; }
.m-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }

<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script>
/*
 * 홀덤 핸드 엔진 — 베팅 진행, 사이드팟, 칩 분배 (DOM 없음, 순수 로직)
 *
 * hand.seats[id] = { stack, start, street, total, folded, allIn, acted, matched }
 *   street  : 이번 스트릿에 낸 칩
 *   total   : 이번 핸드에 낸 칩 합계 (사이드팟 계산 기준)
 *   matched : 마지막으로 행동했을 때 맞춰둔 금액 (불완전 레이즈 재오픈 판정용)
 */
(function (root) {
  'use strict';

  var STREETS = ['프리플랍', '플랍', '턴', '리버'];

  function gcd(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b) { var t = a % b; a = b; b = t; }
    return a;
  }

  function seatList(h) { return h.ring.map(function (id) { return h.seats[id]; }); }
  function liveSeats(h) { return seatList(h).filter(function (s) { return !s.folded; }); }

  function put(s, amount) {
    var a = Math.max(0, Math.min(amount, s.stack));
    s.stack -= a; s.street += a; s.total += a;
    if (s.stack === 0) s.allIn = true;
    return a;
  }

  function log(h, entry) {
    entry.street = h.street;
    h.log.push(entry);
  }

  /**
   * players: [{ id, seat, stack }]  (stack > 0, 2명 이상)
   */
  function newHand(opts) {
    var players = opts.players.slice().sort(function (a, b) { return a.seat - b.seat; });
    if (players.length < 2) throw new Error('플레이어가 2명 이상 필요합니다');
    var ring = players.map(function (p) { return p.id; });
    var n = ring.length;
    var di = Math.max(0, ring.indexOf(opts.dealerId));
    var at = function (k) { return ring[(di + k) % n]; };

    var h = {
      no: opts.no || 1,
      sb: opts.sb, bb: opts.bb,
      unit: gcd(opts.sb, opts.bb) || 1,
      ring: ring,
      dealerId: ring[di],
      sbId: n === 2 ? at(0) : at(1),
      bbId: n === 2 ? at(1) : at(2),
      street: 0,
      phase: 'betting',          // betting → showdown → done
      currentBet: opts.bb,
      minRaise: opts.bb,
      actorId: null,
      runout: false,
      seats: {},
      log: [],
      refunds: {},
      pots: null,
      payouts: null,
      final: null,
      uncontested: false
    };
    players.forEach(function (p) {
      h.seats[p.id] = {
        id: p.id, stack: p.stack, start: p.stack,
        street: 0, total: 0,
        folded: false, allIn: false, acted: false, matched: 0
      };
    });

    log(h, { id: h.sbId, type: 'sb', amount: put(h.seats[h.sbId], opts.sb) });
    log(h, { id: h.bbId, type: 'bb', amount: put(h.seats[h.bbId], opts.bb) });

    // 프리플랍 첫 행동: BB 다음 (헤즈업은 딜러=SB가 먼저)
    var first = n === 2 ? di : (di + 3) % n;
    h.actorId = pendingActor(h, first);
    if (!h.actorId) closeRound(h);
    return h;
  }

  function needsAction(h, s) {
    return !s.folded && !s.allIn && (!s.acted || s.street < h.currentBet);
  }

  function pendingActor(h, fromIdx) {
    var live = liveSeats(h);
    if (live.length <= 1) return null;
    var canAct = live.filter(function (s) { return !s.allIn; });
    if (canAct.length === 0) return null;
    // 상대가 모두 올인이고 이미 금액을 맞췄으면 더 할 행동이 없음
    if (canAct.length === 1 && canAct[0].street >= h.currentBet) return null;
    var n = h.ring.length;
    for (var k = 0; k < n; k++) {
      var s = h.seats[h.ring[(fromIdx + k) % n]];
      if (needsAction(h, s)) return s.id;
    }
    return null;
  }

  function potTotal(h) {
    return seatList(h).reduce(function (a, s) { return a + s.total; }, 0);
  }

  function legal(h) {
    if (h.phase !== 'betting' || !h.actorId) return null;
    var s = h.seats[h.actorId];
    var toCall = Math.max(0, h.currentBet - s.street);
    var maxTo = s.street + s.stack;
    // 이미 행동한 사람은 '풀 레이즈 이상'을 마주했을 때만 다시 레이즈 가능
    var reopened = !s.acted || (h.currentBet - s.matched) >= h.minRaise;
    var canRaise = s.stack > toCall && reopened;
    return {
      id: s.id,
      stack: s.stack,
      street: s.street,
      toCall: toCall,
      callAmt: Math.min(toCall, s.stack),
      canCheck: toCall === 0,
      callIsAllIn: toCall > 0 && s.stack <= toCall,
      canRaise: canRaise,
      isBet: h.currentBet === 0,
      minTo: Math.min(h.currentBet + h.minRaise, maxTo),
      fullMinTo: h.currentBet + h.minRaise,
      maxTo: maxTo,
      pot: potTotal(h)
    };
  }

  /** type: fold | check | call | raise(amount=레이즈 후 총액) | allin */
  function act(h, type, amount) {
    var L = legal(h);
    if (!L) throw new Error('지금은 행동할 수 없습니다');
    var s = h.seats[h.actorId];
    var idx = h.ring.indexOf(s.id);
    var entry = { id: s.id, type: type };

    if (type === 'allin') {
      if (L.canRaise) { type = 'raise'; amount = L.maxTo; }
      else if (L.toCall > 0) { type = 'call'; }
      else throw new Error('올인할 수 없습니다');
    }

    if (type === 'fold') {
      s.folded = true;
    } else if (type === 'check') {
      if (!L.canCheck) throw new Error('체크할 수 없습니다');
    } else if (type === 'call') {
      if (L.toCall === 0) throw new Error('콜할 금액이 없습니다');
      entry.amount = put(s, L.callAmt);
      entry.type = 'call';
    } else if (type === 'raise') {
      var to = Math.round(amount);
      if (!L.canRaise) throw new Error('레이즈할 수 없습니다');
      if (to > L.maxTo) to = L.maxTo;
      if (to <= h.currentBet) throw new Error('현재 베팅보다 커야 합니다');
      if (to < L.fullMinTo && to !== L.maxTo) throw new Error('최소 레이즈는 ' + L.fullMinTo + ' 입니다');
      var wasBet = h.currentBet === 0;
      var raiseBy = to - h.currentBet;
      put(s, to - s.street);
      if (raiseBy >= h.minRaise) h.minRaise = raiseBy;   // 불완전 올인은 최소 레이즈 단위를 바꾸지 않음
      h.currentBet = to;
      entry.type = wasBet ? 'bet' : 'raise';
      entry.amount = to;
    } else {
      throw new Error('알 수 없는 행동: ' + type);
    }

    if (s.allIn && !s.folded) entry.allIn = true;
    s.acted = true;
    s.matched = s.street;
    log(h, entry);

    var next = pendingActor(h, idx + 1);
    if (next) h.actorId = next;
    else closeRound(h);
    return h;
  }

  // 아무도 받지 않은 베팅(언콜드 벳)은 돌려준다
  function returnUncalled(h) {
    var list = seatList(h);
    var top = null;
    list.forEach(function (s) { if (!top || s.street > top.street) top = s; });
    if (!top) return;
    var second = 0;
    list.forEach(function (s) { if (s !== top && s.street > second) second = s.street; });
    var diff = top.street - second;
    if (diff > 0) {
      top.stack += diff; top.street -= diff; top.total -= diff;
      if (top.stack > 0) top.allIn = false;
      log(h, { id: top.id, type: 'return', amount: diff });
    }
  }

  function closeRound(h) {
    h.actorId = null;
    returnUncalled(h);
    seatList(h).forEach(function (s) { s.street = 0; s.acted = false; s.matched = 0; });
    h.currentBet = 0;
    h.minRaise = h.bb;

    var live = liveSeats(h);
    if (live.length === 1) return finishUncontested(h, live[0].id);
    if (h.street >= 3) return startShowdown(h);

    h.street++;
    var di = h.ring.indexOf(h.dealerId);
    var next = pendingActor(h, di + 1);
    if (next) { h.actorId = next; return; }
    // 더 베팅할 사람이 없음 → 리버까지 그냥 진행
    h.runout = true;
    closeRound(h);
  }

  /**
   * 사이드팟 계산. collectedOnly=true 이면 이번 스트릿 베팅 전(가운데로 모인 칩) 기준.
   * 반환: { pots: [{ amount, eligible:[ids] }], refunds: { id: amount } }
   */
  function computePots(h, collectedOnly) {
    var amt = {};
    h.ring.forEach(function (id) {
      var s = h.seats[id];
      amt[id] = collectedOnly ? s.total - s.street : s.total;
    });
    var pots = [];
    for (;;) {
      var live = h.ring.filter(function (id) { return !h.seats[id].folded && amt[id] > 0; });
      if (!live.length) break;
      var m = Math.min.apply(null, live.map(function (id) { return amt[id]; }));
      var amount = 0;
      h.ring.forEach(function (id) {
        var t = Math.min(amt[id], m);
        amount += t; amt[id] -= t;
      });
      pots.push({ amount: amount, eligible: live });
    }
    // 살아있는 사람이 아무도 맞추지 못한 폴드 칩 → 본인에게 반환
    var refunds = {};
    h.ring.forEach(function (id) { if (amt[id] > 0) refunds[id] = amt[id]; });
    return { pots: pots, refunds: refunds };
  }

  function startShowdown(h) {
    h.phase = 'showdown';
    h.street = 3;
    var r = computePots(h, false);
    h.pots = r.pots;
    h.refunds = r.refunds;
  }

  function finishUncontested(h, winnerId) {
    var r = computePots(h, false);
    h.pots = r.pots;
    h.refunds = r.refunds;
    h.uncontested = true;
    settle(h, r.pots.map(function () { return [winnerId]; }));
  }

  // 딜러 왼쪽부터 시계방향 순서 (남는 칩은 이 순서대로)
  function clockwiseFromButton(h) {
    var n = h.ring.length, di = h.ring.indexOf(h.dealerId), out = [];
    for (var k = 1; k <= n; k++) out.push(h.ring[(di + k) % n]);
    return out;
  }

  /** winnersPerPot: [[id, ...], ...]  (h.pots 순서와 동일) */
  function settle(h, winnersPerPot) {
    if (!h.pots) throw new Error('팟 정보가 없습니다');
    var order = clockwiseFromButton(h);
    var payouts = {};
    h.pots.forEach(function (pot, i) {
      var chosen = (winnersPerPot[i] || []).filter(function (id) { return pot.eligible.indexOf(id) >= 0; });
      if (!chosen.length) throw new Error((i === 0 ? '메인팟' : '사이드팟 ' + i) + ' 승자를 선택하세요');
      var winners = order.filter(function (id) { return chosen.indexOf(id) >= 0; });
      var unit = h.unit;
      var units = Math.floor(pot.amount / unit);
      var rest = pot.amount - units * unit;
      var base = Math.floor(units / winners.length);
      var extra = units - base * winners.length;
      winners.forEach(function (id, j) {
        var won = base * unit + (j < extra ? unit : 0) + (j === 0 ? rest : 0);
        payouts[id] = (payouts[id] || 0) + won;
      });
      pot.winners = winners;
    });
    h.payouts = payouts;
    h.final = {};
    h.ring.forEach(function (id) {
      h.final[id] = h.seats[id].stack + (payouts[id] || 0) + (h.refunds[id] || 0);
    });
    h.phase = 'done';
    h.actorId = null;
    return h;
  }

  var Engine = {
    STREETS: STREETS,
    newHand: newHand,
    legal: legal,
    act: act,
    computePots: computePots,
    settle: settle,
    potTotal: potTotal,
    liveSeats: liveSeats,
    gcd: gcd
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = Engine;
  else root.Engine = Engine;
})(this);

  <script>
/* 홀덤 매니저 — 화면 / 상태 관리 */
(function () {
  'use strict';

  const E = window.Engine;
  const KEY = 'holdem-manager:v1';
  const MAX_SEATS = 10;
  const COLORS = ['#f6c350', '#5b9dff', '#3ddc84', '#ff6b73', '#b28cff', '#ff8fc8', '#2fd3c4', '#ff9b4a', '#a3e05c', '#5fd0ff'];

  // ---------------------------------------------------------------- 유틸
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  const fmt = (n) => (Math.round(n) || 0).toLocaleString('ko-KR');
  const won = (n) => fmt(n) + '원';
  const signed = (n) => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const uid = () => Math.random().toString(36).slice(2, 10);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const initial = (name) => (String(name || '?').trim()[0] || '?').toUpperCase();
  const sum = (arr, f) => arr.reduce((a, x) => a + f(x), 0);
  const wide = () => matchMedia('(min-width: 760px)').matches;
  function fmtTime(ms) {
    const t = Math.max(0, Math.ceil(ms / 1000));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    const p = (x) => String(x).padStart(2, '0');
    return h ? `${h}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
  }

        vibrate([200, 100, 200]);

      if (rem <= 0) {
        let moved = false;
        while (rem <= 0) {
          if (c.level >= levels().length - 1) { c.running = false; c.remain = 0; break; }
          c.level++;
          moved = true;
          rem += levels()[c.level].min * 60000;

  function renderNav() {
    const items = [['clock', isT() ? '타이머' : '현황', 'clock'], ['table', '테이블', 'table'], ['players', '플레이어', 'users'], ['settings', '설정', 'settings']];
    return `<nav class="nav"><div class="nav-brand">♠</div>${items.map(([k, label, ic]) => `
      <button class="nav-item ${S.screen === k ? 'on' : ''}" data-action="nav" data-screen="${k}">
        <span class="ico-wrap">${icon(ic)}</span>${label}
        ${k === 'table' && S.hand && S.screen !== 'table' ? '<span class="nav-dot"></span>' : ''}
      </button>`).join('')}</nav>`;
  }

  // ----- 공통 폼 조각
  const numField = (label, path, value, attrs) => `<div class="field"><label>${label}</label>
    <input class="input" type="number" inputmode="numeric" min="0" data-bind="${path}" data-num value="${value}" ${attrs || ''}></div>`;
  const toggleRow = (path, title, sub, checked, rerender) => `<label class="toggle-row">
    <div class="t-text"><div class="t-title">${title}</div>${sub ? `<div class="t-sub">${sub}</div>` : ''}</div>

    const g = S.game, t = isT();

      <div class="grid-2">

      <p class="hint" style="margin-top:8px" data-derived="ratio">${ratioText()}</p>
      ${lockCash ? '<p class="hint" style="margin-top:4px">게임 중에는 칩 가치를 바꿀 수 없어요 (정산이 틀어지지 않도록).</p>' : ''}
      ${t ? `<div class="divider"></div>
        ${toggleRow('game.rebuy.on', '리바이 허용', '칩을 모두 잃으면 다시 구매할 수 있어요', g.rebuy.on, true)}
        ${g.rebuy.on ? `<div class="sub-fields grid-3">
          ${numField('리바이 금액 (원)', 'game.rebuy.won', g.rebuy.won)}
          ${numField('리바이 칩', 'game.rebuy.chips', g.rebuy.chips)}
          ${numField('가능 레벨 (0=계속)', 'game.rebuy.until', g.rebuy.until)}</div>` : ''}
        ${toggleRow('game.addon.on', '애드온 허용', '정해진 금액으로 칩을 추가 구매해요', g.addon.on, true)}
        ${g.addon.on ? `<div class="sub-fields grid-2">
          ${numField('애드온 금액 (원)', 'game.addon.won', g.addon.won)}

        : '<p class="hint" style="margin-top:6px">캐시 게임은 추가 바이인을 언제든 할 수 있고, 금액도 사람마다 다르게 정할 수 있어요.</p>'}`;

    return `<div class="struct-summary">
      <span>레벨 <b>${L.filter((l) => !l.brk).length}</b>개</span>
      <span>휴식 <b>${L.filter((l) => l.brk).length}</b>회</span>
      <span>전체 <b>${fmtDur(sum(L, (l) => l.min))}</b></span>
      <span>시작 <b>${fmt(first.sb)} / ${fmt(first.bb)}</b></span>
      ${S.game.preset === 'custom' ? '<span class="tag gold">직접 편집함</span>' : ''}</div>`;
  }
  function renderStructure(inSettings) {
    const g = S.game;
    const presets = Object.keys(PRESETS).map((k) => `<button class="preset ${g.preset === k ? 'on' : ''}" data-action="preset" data-k="${k}"><b>${PRESETS[k].label}</b><span>${PRESETS[k].desc}</span></button>`).join('');

    return `<h2 class="sec-title">블라인드 구조</h2>
      <div class="preset-grid">${presets}</div>
      <p class="hint" style="margin-top:8px">프리셋은 시작 칩에 맞춰 자동으로 계산돼요 (시작 약 ${PRESETS.standard.depth}BB 기준).</p>
      ${structSummary()}
      ${inSettings ? editor : `<details class="struct-details" ${UI.structOpen ? 'open' : ''}><summary>레벨 자세히 보기 · 편집 ›</summary>${editor}</details>`}`;
  }
  function renderLevelEditor() {
    let no = 0;
    const rows = levels().map((l, i) => {
      const cur = S.started && i === S.clock.level ? 'cur' : '';
      const del = `<button class="lv-del" data-action="lv-del" data-i="${i}" aria-label="삭제">${icon('x')}</button>`;

      return `<div class="lv-row ${cur}"><span class="lv-no">${no}</span>${num('sb')}${num('bb')}${num('min')}${del}</div>`;

  function renderCashBlinds() {

      <div class="grid-2">${numField('스몰 블라인드 (SB)', 'game.cash.sb', c.sb)}${numField('빅 블라인드 (BB)', 'game.cash.bb', c.bb)}</div>
      <div class="chips-row">${opts.map(([s, b]) => `<button class="chip-opt ${c.sb === s && c.bb === b ? 'on' : ''}" data-action="cash-blinds" data-sb="${s}" data-bb="${b}">${fmt(s)} / ${fmt(b)}</button>`).join('')}</div>
      ${S.started ? '<p class="hint" style="margin-top:10px">바꾼 블라인드는 다음 핸드부터 적용돼요.</p>' : ''}`;

  // ----- 새 게임 설정
  function draftChips() {
    if (!S.draft.length) return '<div class="empty-note">2명 이상 추가하세요 (최대 10명)</div>';

      <header class="setup-hero"><div class="logo-mark">♠</div><h1>홀덤 매니저</h1><p>블라인드 타이머 · 핸드 진행 · 사이드팟 자동 계산</p></header>

      <div class="setup-footer"><button class="btn btn-gold btn-lg btn-block" data-action="start-game">${icon('play')} 게임 시작</button></div>

  // ----- 타이머 / 현황 화면
  function tournamentStats() {
    const alive = activePlayers();
    const chips = sum(alive, (p) => p.stack);
    const avg = alive.length ? chips / alive.length : 0;
    const bb = blindsAt(S.clock.level).bb || 1;
    const r = S.game.rebuy;
    const rebuyTxt = !r.on ? '리바이 없음' : rebuyOpen() ? (r.until ? `리바이 Lv ${r.until}까지` : '리바이 계속 가능') : '리바이 마감';
    return `
      <div class="stat"><div class="k">남은 인원</div><div class="v">${alive.length}<small>/ ${S.players.length}</small></div><div class="s">핸드 #${S.handNo}</div></div>
      <div class="stat"><div class="k">평균 스택</div><div class="v">${fmt(avg)}</div><div class="s">${(avg / bb).toFixed(1)} BB</div></div>
      <div class="stat"><div class="k">총 상금</div><div class="v">${won(sum(S.players, (p) => p.invested))}</div><div class="s">총 칩 ${fmt(chips)}</div></div>
      <div class="stat"><div class="k">리바이 · 애드온</div><div class="v">${sum(S.players, (p) => p.rebuys)} · ${sum(S.players, (p) => p.addons)}</div><div class="s">${rebuyTxt}</div></div>
      <div class="stat wide"><div class="k">경과 시간</div><div class="v" data-clock="elapsed">-</div></div>`;
  }
  function levelList() {
    let no = 0;
    const cur = S.clock.level;
    return levels().map((l, i) => {
      if (!l.brk) no++;
      if (i < cur - 1) return '';
      const cls = i < cur ? 'past' : i === cur ? 'cur' : '';
      return `<button class="lv-item ${cls} ${l.brk ? 'brk' : ''}" data-action="clock-goto" data-i="${i}">
        <span class="n">${l.brk ? '휴식' : 'LV ' + no}</span>
        <span class="b">${l.brk ? '휴식 시간' : fmt(l.sb) + ' / ' + fmt(l.bb)}</span>
        <span class="m">${l.min}분</span></button>`;
    }).join('');
  }
  function renderClockScreen() {
    if (!isT()) return renderCashStatus();
    const c = S.clock, L = curLevel(), nx = nextBlindLevel(), brk = !!L.brk, bl = blindsAt(c.level);
    return `<div class="clock-screen">
      <section class="clock-main ${brk ? 'is-break' : ''}">
        <div class="clock-top"><span class="game-name">${esc(S.game.name || '토너먼트')}</span>
          <button class="btn btn-icon sm btn-ghost" data-action="fullscreen" aria-label="전체 화면">${icon('full')}</button></div>
        ${!c.running ? '<div class="paused-badge">일시정지</div>' : ''}
        <div class="lvl-label">${brk ? 'BREAK' : 'LEVEL ' + levelNo(c.level)}</div>
        <div class="time ${c.running ? '' : 'paused'}" data-clock="time">${fmtTime(clockRemain())}</div>
        <div class="progress"><i data-clock="bar"></i></div>
        ${brk
          ? `<div class="blinds-now"><small>휴식 후 블라인드</small><b>${nx ? fmt(nx.sb) + ' / ' + fmt(nx.bb) : '-'}</b></div>`
          : `<div class="blinds-now"><small>BLINDS</small><b>${fmt(bl.sb)} / ${fmt(bl.bb)}</b></div>`}
        <div class="blinds-next">${brk ? '' : nx ? `다음 <b>${fmt(nx.sb)} / ${fmt(nx.bb)}</b> · ` : '마지막 레벨 · '}<span data-clock="nextbreak"></span></div>
        <div class="clock-ctrls">
          <button class="round-btn" data-action="clock-level" data-d="-1" aria-label="이전 레벨">${icon('prev')}</button>
          <button class="round-btn" data-action="clock-add" data-ms="-60000" aria-label="1분 빼기">−1분</button>
          <button class="play-btn ${c.running ? 'running' : ''}" data-action="clock-toggle" aria-label="${c.running ? '일시정지' : '시작'}">${icon(c.running ? 'pause' : 'play')}</button>
          <button class="round-btn" data-action="clock-add" data-ms="60000" aria-label="1분 더하기">+1분</button>
          <button class="round-btn" data-action="clock-level" data-d="1" aria-label="다음 레벨">${icon('next')}</button>
        </div>
      </section>
      <aside class="clock-side">
        <div class="stat-grid">${tournamentStats()}</div>
        <div class="card"><div class="card-title">블라인드 구조 <button class="btn btn-sm btn-ghost" data-action="nav" data-screen="settings">편집</button></div>
          <div class="lv-list">${levelList()}</div></div>
      </aside>
    </div>`;
  }
  function renderCashStatus() {
    const c = S.game.cash, alive = activePlayers();
    const rows = S.players.slice().sort((a, b) => cashNet(b) - cashNet(a)).map((p) => {
      const n = cashNet(p);
      return `<div class="result-row"><span class="avatar sm" style="--c:${p.color}">${esc(initial(p.name))}</span>
        <span class="rn">${esc(p.name)}<small>${p.status === 'out' ? '퇴장' : fmt(p.stack) + '칩'} · 바이인 ${won(p.invested)}</small></span>
        <span class="rv ${n > 0 ? 'plus' : n < 0 ? 'minus' : ''}">${signed(n)}원</span></div>`;
    }).join('');
    return `<div class="clock-screen">
      <section class="clock-main">
        <div class="clock-top"><span class="game-name">${esc(S.game.name || '캐시 게임')}</span>
          <button class="btn btn-icon sm btn-ghost" data-action="fullscreen" aria-label="전체 화면">${icon('full')}</button></div>
        <div class="lvl-label">CASH GAME</div>
        <div class="blinds-now"><small>BLINDS</small><b style="font-size:clamp(56px, min(15vw, 17vh), 150px)">${fmt(c.sb)} / ${fmt(c.bb)}</b></div>
        <div class="blinds-next" style="margin-top:12px">경과 시간</div>
        <div class="time" style="font-size:clamp(48px, min(12vw, 13vh), 120px)" data-clock="elapsed"></div>
        <div class="clock-ctrls"><button class="btn btn-gold btn-lg" data-action="nav" data-screen="table">${icon('table')} 테이블로 가기</button></div>
      </section>
      <aside class="clock-side">
        <div class="stat-grid">
          <div class="stat"><div class="k">플레이 중</div><div class="v">${seated().filter((p) => p.status === 'in').length}<small>명</small></div><div class="s">자리 비움 ${seated().filter((p) => p.status === 'away').length}명</div></div>
          <div class="stat"><div class="k">핸드</div><div class="v">${S.handNo}</div><div class="s">진행한 핸드 수</div></div>
          <div class="stat"><div class="k">총 바이인</div><div class="v">${won(sum(S.players, (p) => p.invested))}</div><div class="s">추가 바이인 ${sum(S.players, (p) => p.rebuys)}회</div></div>
          <div class="stat"><div class="k">테이블 칩</div><div class="v">${fmt(sum(alive, (p) => p.stack))}</div><div class="s">${ratioText().replace(/<[^>]+>/g, '')}</div></div>
        </div>
        <div class="card"><div class="card-title">현재 손익</div><div class="result-list" style="margin-top:0">${rows || '<div class="empty-note">플레이어가 없어요</div>'}</div></div>
      </aside>
    </div>`;
  }

  // ----- 테이블 화면
  const ACT_LABEL = { fold: '폴드', check: '체크', call: '콜', bet: '벳', raise: '레이즈', sb: 'SB', bb: 'BB', return: '반환' };
  function lastAction(h, id) {
    for (let i = h.log.length - 1; i >= 0; i--) {
      const e = h.log[i];
      if (e.street !== h.street) break;
      if (e.id === id && e.type !== 'return' && e.type !== 'sb' && e.type !== 'bb') return e;
    }
    return null;
  }
  function renderTopbar() {
    const no = S.hand ? S.hand.no : S.handNo + 1;
    let clock;
    if (isT()) {
      const L = curLevel(), bl = blindsAt(S.clock.level), run = S.clock.running;
      clock = `<button class="mini-clock ${run ? '' : 'paused'}" data-action="clock-toggle" aria-label="타이머 ${run ? '일시정지' : '시작'}">
        <span class="mc-lv">${L.brk ? '휴식' : 'LV ' + levelNo(S.clock.level)}</span>
        <span class="mc-bl">${fmt(bl.sb)}/${fmt(bl.bb)}</span>
        <span class="mc-time" data-clock="time">${fmtTime(clockRemain())}</span>
        <span class="mc-ico">${icon(run ? 'pause' : 'play')}</span></button>`;
    } else {
      clock = `<div class="mini-clock" style="padding-right:14px"><span class="mc-lv">CASH</span>
        <span class="mc-bl">${fmt(S.game.cash.sb)}/${fmt(S.game.cash.bb)}</span><span class="mc-time" data-clock="elapsed"></span></div>`;
    }
    return `<div class="topbar">${clock}<span class="hand-no">핸드 #${no}</span>
      <button class="btn btn-icon sm btn-ghost" data-action="fullscreen" aria-label="전체 화면">${icon('full')}</button></div>`;
  }
  function renderCenter() {
    const h = S.hand;
    if (!h) {
      const bl = currentBlinds();
      return `<div class="table-center"><div class="center-logo">♠</div>
        <div class="pot-label">BLINDS</div><div class="center-blinds">${fmt(bl.sb)} / ${fmt(bl.bb)}</div></div>`;
    }
    const seats = Object.values(h.seats);
    const total = sum(seats, (s) => s.total);
    const streetBets = h.phase === 'betting' ? sum(seats, (s) => s.street) : 0;
    const dealt = [0, 3, 4, 5][h.street];
    const pots = h.phase === 'betting' ? E.computePots(h, true).pots : h.pots || [];
    const cards = [0, 1, 2, 3, 4].map((i) => `<span class="card-slot ${i < dealt ? 'dealt' : ''}" style="${i < UI.shownDealt ? 'animation:none' : ''}"></span>`).join('');
    UI.shownDealt = dealt;
    const pill = h.phase === 'showdown' ? '<span class="street-pill sd">쇼다운</span>' : h.phase === 'done' ? '<span class="street-pill">핸드 종료</span>' : `<span class="street-pill">${E.STREETS[h.street]}</span>`;
    return `<div class="table-center">${pill}
      <div class="board">${cards}</div>
      <div class="pot-label">POT</div>
      <div class="pot-amount">${fmt(total)}</div>
      ${streetBets && total > streetBets ? `<div class="pot-sub">가운데 ${fmt(total - streetBets)} · 이번 베팅 ${fmt(streetBets)}</div>` : ''}
      ${pots.length > 1 ? `<div class="side-pots">${pots.map((p, i) => `<span class="side-pot">${i ? '사이드' + i : '메인'} <b>${fmt(p.amount)}</b></span>`).join('')}</div>` : ''}
    </div>`;
  }
  function renderSeats() {
    const h = S.hand;
    const pre = h ? null : previewPositions();
    const sdPot = h && h.phase === 'showdown' ? h.pots[UI.activePot] : null;
    let bets = '';
    const html = seated().map((p) => {
      const hs = h ? h.seats[p.id] : null;
      const cls = ['seat'];
      let stackTxt = fmt(hs ? hs.stack : p.stack), stackCls = '', label = '', labelCls = '';
      const isD = h ? h.dealerId === p.id : pre.d === p.id;
      const pos = h ? (h.sbId === p.id ? 'SB' : h.bbId === p.id ? 'BB' : '') : (pre.sb === p.id ? 'SB' : pre.bb === p.id ? 'BB' : '');
      if (!hs) {
        if (h || p.status !== 'in' || p.stack <= 0) {
          cls.push('idle');
          labelCls = 'idle';
          label = p.status === 'away' ? '자리 비움' : p.stack <= 0 ? '칩 없음' : '대기';
        } else cls.push('btn-target');
      } else {
        if (hs.folded) { cls.push('folded'); label = '폴드'; labelCls = 'fold'; }
        else if (hs.allIn && hs.stack === 0) { stackTxt = 'ALL-IN'; stackCls = 'allin'; }
        if (h.phase === 'betting') {
          if (h.actorId === p.id) cls.push('acting');
          if (!hs.folded) {
            const e = lastAction(h, p.id);
            if (e) { label = e.allIn ? '올인' : ACT_LABEL[e.type]; labelCls = e.allIn ? 'allin' : e.type; }

          if (hs.street > 0) bets += `<div class="bet" data-bet="${p.id}"><span class="chip-ico"></span>${fmt(hs.street)}</div>`;

        if (sdPot && sdPot.eligible.indexOf(p.id) >= 0) {
          cls.push('pickable');
          if (h.sel[UI.activePot].indexOf(p.id) >= 0) cls.push('picked');
        }
        if (h.phase === 'done') {
          const d = h.final[p.id] - hs.start;
          stackTxt = fmt(h.final[p.id]);
          stackCls = '';
          if (d > 0) { cls.push('winner'); label = '+' + fmt(d); labelCls = 'win'; }
          else if (d < 0 && !hs.folded) { label = '−' + fmt(-d); labelCls = 'lose'; }

  // 경기장(스타디움) 모양 둘레를 따라 좌석을 같은 간격으로 배치 — 아래 가운데부터 시계방향
  function stadiumPoints(cx, cy, w, h, n) {
    const horiz = w >= h, r = (horiz ? h : w) / 2, L = Math.abs(w - h), PI = Math.PI;
    const P = 2 * L + 2 * PI * r;
    const at = (s) => {
      if (horiz) {
        if (s < L / 2) return [cx - s, cy + r];
        s -= L / 2;
        if (s < PI * r) { const a = PI / 2 + s / r; return [cx - L / 2 + r * Math.cos(a), cy + r * Math.sin(a)]; }
        s -= PI * r;
        if (s < L) return [cx - L / 2 + s, cy - r];
        s -= L;
        if (s < PI * r) { const a = -PI / 2 + s / r; return [cx + L / 2 + r * Math.cos(a), cy + r * Math.sin(a)]; }
        s -= PI * r;
        return [cx + L / 2 - s, cy + r];
      }
      const q = (PI * r) / 2;
      if (s < q) { const a = PI / 2 + s / r; return [cx + r * Math.cos(a), cy + L / 2 + r * Math.sin(a)]; }
      s -= q;
      if (s < L) return [cx - r, cy + L / 2 - s];
      s -= L;
      if (s < PI * r) { const a = PI + s / r; return [cx + r * Math.cos(a), cy - L / 2 + r * Math.sin(a)]; }
      s -= PI * r;
      if (s < L) return [cx + r, cy - L / 2 + s];
      s -= L;
      const a = s / r;
      return [cx + r * Math.cos(a), cy + L / 2 + r * Math.sin(a)];
    };
    const pts = [];
    for (let i = 0; i < n; i++) pts.push(at((i / n) * P));
    return pts;
  }
  function layoutTable() {
    const area = $('.table-area');
    if (!area) return;
    const W = area.clientWidth, H = area.clientHeight;
    if (!W || !H) return;
    const seats = $$('.seat', area);
    const sw = seats[0] ? seats[0].offsetWidth : 96, sh = seats[0] ? seats[0].offsetHeight : 70;
    const padX = sw / 2 + 14, padY = sh / 2 + 22;
    const pw = Math.max(80, W - padX * 2), ph = Math.max(80, H - padY * 2);
    const cx = W / 2, cy = H / 2;
    const felt = $('.felt', area);
    felt.style.cssText = `left:${cx - pw / 2}px;top:${cy - ph / 2}px;width:${pw}px;height:${ph}px`;
    const pts = stadiumPoints(cx, cy, pw, ph, seats.length);
    const pos = {};
    seats.forEach((el, i) => {
      el.style.left = pts[i][0] + 'px';
      el.style.top = pts[i][1] + 'px';
      el.classList.add('placed');
      pos[el.dataset.id] = pts[i];
    });
    // 베팅 칩: 좌석에서 테이블 중심선 쪽으로, 좌석 카드와 겹치지 않을 만큼 띄운다
    const horiz = pw >= ph, half = Math.abs(pw - ph) / 2;
    $$('.bet', area).forEach((el) => {
      const p = pos[el.dataset.bet];
      if (!p) return;
      const tx = horiz ? clamp(p[0], cx - half, cx + half) : cx;
      const ty = horiz ? cy : clamp(p[1], cy - half, cy + half);
      const dist = Math.hypot(tx - p[0], ty - p[1]) || 1;
      const ux = (tx - p[0]) / dist, uy = (ty - p[1]) / dist;
      const reach = Math.abs(ux) * (sw + el.offsetWidth) / 2 + Math.abs(uy) * (sh + el.offsetHeight) / 2 + (uy < 0 ? 18 : 0) + 8;
      const d = Math.min(dist * 0.85, reach);
      el.style.left = p[0] + ux * d + 'px';
      el.style.top = p[1] + uy * d + 'px';
      el.classList.add('placed');
    });
    const center = $('.table-center', area);
    if (center) center.style.width = Math.max(130, horiz ? pw - sw * 1.7 : pw - sw * 1.75) + 'px';
  }
